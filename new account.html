      <header id="head">
<h1>Chris Webs</h1>
    </header>
    <br><br>
    <section id="signup">
        <img src="profile.png" alt="web icon" id="profile">
        <br><br>
        <form action="/login">
            <label for="Your name" id="Your-name">Full names;</label><br>
            <input type="text" name="name" id="full-name" placeholder="Full Name"><br><br>
            <label for="email" id="enter-email">Email:</label><br>
            <input type="email" name="email" id="email" placeholder="Enter email" autocomplete="email"><br><br>
            <label for="tel" id="phone">Phone number:</label><br>
            <input type="tel" name="tel" id="tel" placeholder="+254..."><br><br>
            <label for="name" id="you">Username:</label><br>
            <input type="text" name="name" id="name" placeholder="Username">
            <br><br>
            <label for="password" id="safe">Password:</label><br>
            <input type="password" name="password" id="password" placeholder="Input password" autocomplete="new-password">
        </form>
        <br><br>
        <a href="New password.html"><button id="next">Next</button></a>
    </section>
