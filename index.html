    <section id="signup">
        <img src="profile.png" alt="web icon" id="profile">
        <br><br>
        <form action="/login">
            <label for="name" id="you">Username:</label><br>
            <input type="text" name="name" id="name" placeholder="Username">
            <br><br>
            <label for="password" id="safe">Password:</label><br>
            <input type="password" name="password" id="password" placeholder="Input password">
        </form>
        <br><br>
        <p id="new">Dont have an account??
        <a href="new account.html" id="link">Create new account</a></p>
        <button id="next">Sign in</button>
    </section>
